# blog.meathill.com —— 历史公开 URL 收敛到 meathill.com（nginx 版，Issue #4）
#
# 放进 blog.meathill.com 的 server {} 块内。顺序很重要：保留块在前，重定向在后。
# ⚠️ 把下面“保留块”替换成你现有的处理（fastcgi_pass / proxy_pass 到 PHP-FPM 等），
#    不要让 API / 后台 / 媒体被重定向，否则 meathill.com 会拿不到数据和图片。
#    应用前先在测试环境验证，并参考本目录 README 的 curl 检查。

# ---- 1) 保留：API / 后台 / 媒体（^~ 前缀优先于下方正则，命中即走原有处理）----
location ^~ /wp-json/   { try_files $uri $uri/ /index.php?$args; }   # ← 改成你现有的 PHP 处理
location ^~ /wp-admin/  { try_files $uri $uri/ /index.php?$args; }
location ^~ /wp-content/ { try_files $uri =404; }
location ^~ /wp-includes/ { try_files $uri =404; }
location = /wp-login.php { try_files $uri /index.php?$args; }
location = /xmlrpc.php   { try_files $uri /index.php?$args; }

# ---- 2) 旧 sitemap -> 410（让 Google 彻底放弃）----
location ~* sitemap.*\.xml$   { return 410; }
location = /news-sitemap.xml  { return 410; }

# ---- 3) .html 文章 -> meathill 规范页（Next.js 再 301 补全分类）----
location ~* ^/(.+)\.html$ { return 301 https://meathill.com/posts/$1; }

# ---- 4) 分类 / 标签 / 作者 归档 ----
location ^~ /category/ { return 301 https://meathill.com$request_uri; }
location ^~ /tag/      { return 301 https://meathill.com$request_uri; }
location ~* ^/author/(.*)$ { return 301 https://meathill.com/posts/author/$1; }

# ---- 5) 其余公开路径兜底 -> 首页（避免 301 指向 404）----
location / { return 301 https://meathill.com/; }
