# blog.meathill.com —— 过渡方案：不做 301，只给历史公开前台加 noindex（Issue #4）
#
# 当全量 301 风险较高时先用本方案：保留页面可访问，但让搜索引擎不再索引，
# 观察一段时间确认无副作用后，再切换到 blog-redirect.* 的 301 收敛。
# 关键同样是：API / 后台 / 媒体 不能加 noindex（否则可能影响抓取/展示）。

# ===== nginx 版（放进 blog.meathill.com 的 server {} 内）=====
# 默认给所有响应加 noindex
# add_header X-Robots-Tag "noindex, follow" always;
#
# 但要在 API/后台/媒体处“取消”该头（重新声明为空或允许索引）：
# location ^~ /wp-json/    { add_header X-Robots-Tag "" always; try_files $uri /index.php?$args; }
# location ^~ /wp-admin/   { add_header X-Robots-Tag "" always; try_files $uri /index.php?$args; }
# location ^~ /wp-content/ { add_header X-Robots-Tag "" always; try_files $uri =404; }
#
# 旧 sitemap 仍建议 410：
# location ~* sitemap.*\.xml$  { return 410; }
# location = /news-sitemap.xml { return 410; }

# ===== Apache 版（.htaccess，置于 WordPress 块之前）=====
# <IfModule mod_headers.c>
#   # 仅对“非 API/后台/媒体”的公开页面加 noindex
#   <If "%{REQUEST_URI} !~ m#^/(wp-json|wp-admin|wp-content|wp-includes|wp-login\.php|xmlrpc\.php)#">
#     Header set X-Robots-Tag "noindex, follow"
#   </If>
# </IfModule>
# <IfModule mod_rewrite.c>
#   RewriteEngine On
#   RewriteRule sitemap.*\.xml$ - [G,L]
#   RewriteRule ^news-sitemap\.xml$ - [G,L]
# </IfModule>
